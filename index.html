<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practiquem català · 3r d'ESO</title><style>
body{margin:0;background:#fbfaf4;color:#174f91;font-family:Arial,sans-serif}
main{max-width:1280px;margin:auto;padding:34px 20px 60px}
.bars{display:flex;height:13px;margin-bottom:40px}
.bars i:nth-child(1){background:#2868ad;flex:1.25}
.bars i:nth-child(2){background:#ffcc70;flex:1}
.bars i:nth-child(3){background:#9ab9d8;flex:.9}

.crumb{color:#2868ad;font-weight:800;text-decoration:none}.disabled{opacity:.62}
.sa-card{background:#ffcc70;display:grid;grid-template-columns:1fr 160px;gap:24px;align-items:center;min-height:230px;padding:28px}
.sa-card .sa-copy{min-width:0}
.sa-card img{width:160px;height:160px;border-radius:50%;object-fit:cover;display:block}
.sa-card .badge{background:#2868ad;color:white;font-size:19px;padding:9px 14px}
.sa-card h2{font-size:39px;line-height:1.05;margin:12px 0 10px;font-weight:900}
.sa-card p{font-size:17px;line-height:1.4;margin:0 0 8px;color:#314f6d}
.sa-card .go{font-size:16px;margin-top:12px}
@media(max-width:760px){.cards{grid-template-columns:1fr}.sa-card{grid-template-columns:1fr 100px;min-height:180px;padding:21px}.sa-card img{width:100px;height:100px}}
